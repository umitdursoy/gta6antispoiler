<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 180px;
      padding: 12px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f9f9f9;
      margin: 0;
      text-align: center;
    }
    h3 {
      font-size: 14px;
      margin: 0 0 10px 0;
      color: #333;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 24px;
    }
    .switch input { 
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #ccc;
      transition: .3s;
      border-radius: 24px;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #2ecc71;
    }
    input:checked + .slider:before {
      transform: translateX(26px);
    }
    #status {
      margin-top: 8px;
      font-size: 12px;
      font-weight: bold;
      color: #555;
    }
  </style>
</head>
<body>
  <h3>GTA 6 Koruması</h3>
  <label class="switch">
    <input type="checkbox" id="toggleState">
    <span class="slider"></span>
  </label>
  <div id="status">Aktif</div>

  <script src="popup.js"></script>
</body>
</html>
